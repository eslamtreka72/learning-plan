<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>خطة التعلم</title>
<meta name="theme-color" content="#e8f0ff">
<style>
:root{--ink:#1f2a3d;--muted:#667287;--line:rgba(60,90,160,.16);--glass:rgba(255,255,255,.62);--accent:#2f6bff;--accent2:#6a4cff;--en:#0f9d7a;--ai:#2f6bff;--tp:#d9822b;font-family:Tahoma,Arial,sans-serif;color:var(--ink);font-synthesis:none}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 95% 0,#cfdcff 0,transparent 48%),radial-gradient(ellipse at 0 55%,#dcf3ee 0,transparent 45%),linear-gradient(135deg,#f6f9ff,#eaf0ff);background-attachment:fixed}
button{font:inherit;cursor:pointer;min-height:44px;border:0;border-radius:14px;color:inherit;background:rgba(255,255,255,.7);padding:10px 16px}
button:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.app{max-width:960px;margin:auto;padding:22px 16px 40px}
h1{font-size:27px;margin:0 0 6px;font-weight:600;letter-spacing:-.5px}
.sub{color:var(--muted);font-size:13px;line-height:1.9;margin:0 0 18px}
.glass{background:var(--glass);border:1px solid rgba(255,255,255,.9);box-shadow:0 8px 28px rgba(50,80,170,.08);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-radius:22px;padding:18px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.stat label{display:block;font-size:11px;color:var(--muted)}
.stat strong{display:block;font:600 26px/1.4 Arial,sans-serif;margin:6px 0 2px}
.stat small{font-size:11px;color:var(--muted)}
.bar{height:7px;background:rgba(60,90,160,.12);border-radius:4px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,var(--accent),var(--accent2))}
nav{display:flex;gap:6px;padding:6px;background:rgba(255,255,255,.7);border:1px solid #fff;backdrop-filter:blur(20px);border-radius:18px;margin:0 0 16px}
nav button{flex:1;background:transparent;font-size:13px;border-radius:13px}
nav button.on{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;box-shadow:0 4px 12px rgba(47,107,255,.3)}
.today h2{margin:0 0 4px;font-size:18px}
.badge{display:inline-block;font-size:10px;border-radius:8px;padding:3px 8px;margin-inline-end:6px;color:#fff;vertical-align:middle}
.b-en{background:var(--en)}.b-ai{background:var(--ai)}.b-topic{background:var(--tp)}
.task{display:flex;flex-direction:column;gap:3px;padding:10px 0;border-top:1px solid var(--line);font-size:14px;line-height:1.8}
.task:first-of-type{border-top:0}
.task a{color:var(--accent);font-size:13px;font-weight:600;text-decoration:none;word-break:break-word}
.task a:hover{text-decoration:underline}
.min{color:var(--muted);font-size:12px}
.dayhead{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.done-btn{min-width:120px;background:rgba(255,255,255,.85);border:1px solid var(--line);font-size:13px}
.done-btn.on{background:var(--en);color:#fff;border-color:transparent}
details.week{margin-top:12px;padding:6px 18px}
details.week>summary{cursor:pointer;list-style:none;display:flex;gap:10px;align-items:baseline;min-height:48px;padding:12px 0}
details.week>summary::-webkit-details-marker{display:none}
.wn{font-size:12px;color:var(--muted);white-space:nowrap}.wt{font-weight:600;font-size:14px}
.goal{font-size:13px;color:var(--muted);margin:0 0 6px;line-height:1.8}
.day{border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin:10px 0;background:rgba(255,255,255,.45)}
.day.is-done{background:rgba(15,157,122,.09)}
.day.is-today{border-color:var(--accent);box-shadow:0 0 0 2px rgba(47,107,255,.18)}
.dn{font-weight:600;font-size:14px}.dd{color:var(--muted);font-size:12px}
footer{text-align:center;color:var(--muted);font-size:11px;line-height:1.9;padding:18px 0}
@media(max-width:640px){.stats{grid-template-columns:1fr 1fr}h1{font-size:23px}nav button{font-size:12px;padding:8px}}
</style></head><body><div class="app">
<h1>خطة التعلم، خطوة بخطوة</h1>
<p class="sub">الإنجليزي و AI Agents مع بعض كل يوم، وبعدهم Storytelling ثم Digital Distribution. كل المصادر مجانية، وكل مهمة ليها لينك تفتحه بضغطة.</p>
<div class="stats" id="stats"></div>
<div class="glass today" id="today"></div>
<nav id="nav" style="margin-top:16px"></nav>
<div id="phase"></div>
<footer>التقدم بيتحفظ في المتصفح على الجهاز ده فقط.<br>كورس Agentic AI من DeepLearning.AI مجاني بوضع Audit (بدون شهادة). n8n مجاني لو شغلته على جهازك.</footer>
</div>
